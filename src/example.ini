# network-sandbox example config. Review the whitelist, then start network-sandbox again.
# See doc/spec.md for the full syntax.

[network-sandbox]
port=8080                      # required, 1-65535
logfile=network-sandbox.log    # optional; relative paths resolve next to the exe
loglevel=info                  # optional: error | warn | info | debug

[whitelist]
# host:port, *.domain:port (subdomains only), 1.2.3.4:443 or [2001:db8::1]:443
# Claude
api.anthropic.com:443
claude.ai:443
platform.claude.com:443
downloads.claude.ai:443
# Microsoft
microsoft.com:443
# GitHub
github.com:443
*.githubusercontent.com:443
